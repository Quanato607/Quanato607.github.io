<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Shenghao Zhu</title>
  <link rel="icon" href="/images/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/assets/css/modern-home.css">
  <script>
    (function () {
      try {
        var saved = localStorage.getItem("sz-theme");
        var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.setAttribute("data-theme", saved || (prefersDark ? "dark" : "light"));
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div class="ambient-backdrop" aria-hidden="true"></div>
  <main class="container" style="min-height: 75vh; display: grid; place-items: center;">
    <section class="glass-card hero-main" style="max-width: 560px; text-align: center; align-items: center;">
      <p class="section-eyebrow">404 · Not Found</p>
      <h1 class="hero-title" style="margin-top: 8px;">Page Not Found</h1>
      <p style="color: var(--ink-secondary); margin: 8px 0 22px;">
        The requested page could not be found on Shenghao Zhu’s academic homepage.
      </p>
      <div class="hero-actions" style="margin-top: 0; justify-content: center;">
        <a class="action-btn action-btn--primary" href="/">Return to Homepage</a>
        <a class="action-btn" href="/cv/">View CV</a>
      </div>
    </section>
  </main>
</body>
</html>
