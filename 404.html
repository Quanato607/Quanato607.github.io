<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Shenghao Zhu</title>
  <meta name="theme-color" content="#141311">
  <link rel="icon" href="/images/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/modern-home.css">
  <script>
    (function () {
      try {
        localStorage.removeItem("sz-ink-theme");
        var manual = sessionStorage.getItem("sz-theme-session");
        var theme = (manual === "dark" || manual === "light")
          ? manual
          : ((window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) || (function () { var h = new Date().getHours(); return h >= 19 || h < 7; })()
              ? "dark"
              : "light");
        document.documentElement.setAttribute("data-theme", theme);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", theme === "dark" ? "#141311" : "#f7f4ed");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body>
  <main class="mono-wrap">
    <section class="mono-notfound" aria-labelledby="notfound-heading">
      <p class="contact" style="margin: 0;">404 · Not Found</p>
      <h1 id="notfound-heading">Page Not Found</h1>
      <p>The requested page could not be found on Shenghao Zhu’s academic homepage.</p>
      <div class="mono-notfound-actions">
        <a href="/">Return to Homepage</a>
        <a href="/cv/">Curriculum Vitae</a>
      </div>
    </section>
  </main>
</body>
</html>
